<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matemática do Zero</title>
  <meta name="description" content="Curso gratuito de matemática do zero ao cálculo, com história, interativos e treino infinito.">
  <meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Lexend:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script>
    // Aplica o tema salvo antes de pintar a página (evita "piscar").
    try {
      const s = JSON.parse(localStorage.getItem('matematica-do-zero:v1') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Matemática do Zero, página inicial">
      <span class="brand-mark" aria-hidden="true">0</span>
      <span class="brand-name">Matemática <em>do Zero</em></span>
    </a>
    <nav class="topnav" aria-label="Principal">
      <a href="#/" data-nav="trilha">Trilha</a>
      <a href="#/treino-misto" data-nav="treino">Treino</a>
      <a href="#/busca" data-nav="busca">Buscar</a>
    </nav>
    <button class="icon-btn" data-action="theme" aria-label="Alternar modo claro/escuro">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="sitefoot">
    <p>Matemática do Zero — curso livre e gratuito. Seu progresso fica salvo só neste aparelho.</p>
    <p><button class="linklike" id="reset-progress">Apagar meu progresso</button></p>
  </footer>

  <nav class="tabbar" aria-label="Navegação rápida">
    <a href="#/" data-nav="trilha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c4 0 4-6 8-6s4-6 8-6"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="7" r="2"/></svg>Trilha</a>
    <a href="#/treino-misto" data-nav="treino"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Treino</a>
    <a href="#/busca" data-nav="busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Buscar</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
